spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cat_rescue?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.catrescue.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 文件上传路径
file:
  upload-path: /uploads/

# 支付宝配置
alipay:
  app-id: your_app_id
  private-key: your_private_key
  public-key: your_public_key
  gateway-url: https://openapi.alipay.com/gateway.do